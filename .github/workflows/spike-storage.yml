# The storage spike (#91), never merged. Forms one cluster per candidate through cluster.yml, all at once, and slot 1
# of each runs spike/storage.sh, which writes the measurements to that slot's job summary.
# workflow_dispatch only lists workflows on the default branch, so the push trigger runs it once with the defaults and
# registers it. After that, `gh workflow run spike-storage.yml --ref spike/storage -f candidates=... -f nodes=...`.
name: spike-storage

on:
  push:
    branches: [spike/storage]
  workflow_dispatch:
    inputs:
      candidates:
        description: Space-separated linstor, rook-ceph, longhorn, each optionally :<nodes> (rook-ceph:3).
        type: string
        default: longhorn
      nodes:
        description: Nodes per cluster without a :<nodes>, 3 to 6.
        type: number
        default: 3

permissions:
  contents: read

# One dispatch at a time. cluster.yml's tailnet job ends before its slots start, so a cluster peaks at one runner per
# node, and three 6-node clusters at 18 of the 20 shared runners.
concurrency:
  group: spike-storage
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image.yml

  # The .debs of cluster.yml's Install libvirt step, with every dependency the runner image lacks, downloaded once
  # into the cache. The Ubuntu mirror served some runners at 79 kB/s, so their slots missed preflight (run
  # 36890732575). The runner image decides which dependencies are missing, so it is in the key. PACKAGES must match
  # that step's list. A slot whose install from the cache fails uses the mirror.
  debs:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    env:
      PACKAGES: libvirt-daemon-system qemu-system-x86 qemu-utils ovmf dnsmasq-base nftables
    steps:
      - id: key
        run: echo "key=libvirt-debs-$ImageOS-$ImageVersion-$(sha256sum <<<"$PACKAGES" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: debs
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p debs/partial
          SECONDS=0
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install --download-only -y -o Dir::Cache::archives="$PWD/debs" $PACKAGES
          sudo rm -rf debs/partial debs/lock
          sudo chown -R "$USER" debs
          debs=(debs/*.deb)
          echo "downloaded ${#debs[@]} .debs in ${SECONDS} s" | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: debs
          key: ${{ steps.key.outputs.key }}

  # One row per candidate. Every node gets 12 GiB and a 30 GiB data disk. LINSTOR's DRBD module is built at boot and
  # unsigned, so its nodes boot without Secure Boot.
  candidates:
    runs-on: ubuntu-24.04
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - id: rows
        run: |
          # The assignment fails the step on a bad candidate. An argument's command substitution would not.
          rows=$(jq --compact-output --null-input --arg c "$CANDIDATES" --argjson n "$NODES" '
            [$c | splits(" +") | select(. != "") | split(":") | {c: .[0], n: (.[1] // $n | tonumber)}
              | if (.c | IN("linstor", "rook-ceph", "longhorn")) | not then error("unknown candidate \(.c)")
                elif .n < 3 or .n > 6 or .n != (.n | floor) then error("\(.c): nodes must be 3 to 6")
                else . end
              | {id: "storage-\(.c)-\(.n)", candidate: .c, nodes: .n,
                 tf_vars: ({candidate: .c, memory_mib: 12288, data_disk_gib: 30}
                   + (if .c == "linstor" then {secure_boot: false} else {} end))}]')
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
        env:
          CANDIDATES: ${{ inputs.candidates || 'longhorn' }}
          NODES: ${{ inputs.nodes || 3 }}

  spike:
    needs: [image, debs, candidates]
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.candidates.outputs.rows) }}
    uses: ./.github/workflows/cluster.yml
    secrets: inherit
    with:
      id: ${{ matrix.id }}
      nodes: ${{ matrix.nodes }}
      control_plane_count: 3
      case: happy
      test: storage
      expect_nodes: ${{ matrix.nodes }}
      expect_servers: 3
      image_key: ${{ needs.image.outputs.key }}
      tf_vars: ${{ toJSON(matrix.tf_vars) }}
      spike: true
      debs_key: ${{ needs.debs.outputs.key }}
