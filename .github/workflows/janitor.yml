# Removes the Headscale users of CI runs older than 3 h. Nothing else removes them (#85).
name: janitor

# ci/systemd/cluster-janitor.timer dispatches it hourly, since GitHub's schedule started late or not at all. The
# schedule stays as a backup, so leftover users are still removed while rocky-runner is down. Off the hour, which is
# GitHub's busiest time for schedules.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Remove ci-* users older than this many hours. A value below a live run's age deletes that run's user.
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-24.04
    environment: headscale
    steps:
      - uses: actions/checkout@v7

      # A scheduled run has no inputs. A dispatch without inputs gets the default 3.
      - run: ci/headscale.sh janitor "${HOURS:-3}"
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          HOURS: ${{ inputs.hours }}
