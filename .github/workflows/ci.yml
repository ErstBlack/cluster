name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run on its ref, so overlapping pushes never push nightly past the 20 shared runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per justfile recipe, so the checks run in parallel.
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [unit, tofu-check, cloud-init-schema, shellcheck, ruff, actionlint]
        include:
          - check: actionlint
            install: |
              bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
              sudo mv actionlint /usr/local/bin/
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - if: matrix.check == 'tofu-check' || matrix.check == 'cloud-init-schema'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      # setup-uv publishes no major-version tags after v7, so it is pinned to a release.
      - if: matrix.check == 'ruff'
        uses: astral-sh/setup-uv@v10.2.0

      - if: matrix.install
        run: ${{ matrix.install }}

      - run: just ${{ matrix.check }}

  # Builds the image once on a cache miss, so the test slots never build it in parallel.
  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
      # Only a save that ran and succeeded counts, so a job that failed before the build never triggers a prune.
      built: ${{ steps.save.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      # hashFiles is not available in job outputs, so a step records the key.
      - id: key
        run: echo "key=rocky-rke2-airgap-${{ hashFiles('image/*') }}" >> "$GITHUB_OUTPUT"

      # The airgap- prefix keeps pre-airgap entries from being restored.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: image/output/rocky-rke2.qcow2
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # airgap.sh fetches into a fixed path under /srv, which the runner user cannot create.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo install -d -o "$USER" /srv/rocky-cluster/images/agent-images
          image/build.sh

      - id: save
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: image/output/rocky-rke2.qcow2
          key: ${{ steps.key.outputs.key }}

  # One 3-node cluster, the happy case with tofu/tests/multi.tftest.hcl.
  cluster:
    needs: image
    uses: ./.github/workflows/cluster.yml
    secrets: inherit
    with:
      id: push
      nodes: 3
      control_plane_count: 3
      case: happy
      test: multi
      expect_nodes: 3
      expect_servers: 3
      image_key: ${{ needs.image.outputs.key }}

  # Reports a rebuilt image's cache entry size. On master it deletes the entries the new one supersedes.
  # A separate job, so the job that runs the image build never holds actions: write.
  image-cache:
    needs: image
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEY: ${{ needs.image.outputs.key }}
    steps:
      - run: |
          gh cache list --key "$KEY" --json key,ref,sizeInBytes \
            --jq '"| key | ref | bytes |\n|---|---|---|", (.[] | "| \(.key) | \(.ref) | \(.sizeInBytes) |")' \
            >> "$GITHUB_STEP_SUMMARY"

      - if: github.ref == 'refs/heads/master'
        run: |
          : "${KEY:?an empty key would select every entry}"
          gh cache list --ref refs/heads/master --key rocky-rke2- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | .id" | xargs -r -n1 gh cache delete
