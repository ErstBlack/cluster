# Rocky 10 golden image with RKE2 staged. At first boot the rke2-elect unit from cloud-init picks the
# node's role, and rke2-configure writes /etc/rancher/rke2/config.yaml and starts rke2-server or
# rke2-agent. Build with image/build.sh.
# The qcow2 image type already brings cloud-init and shim-x64 and leaves out firewalld.
name = "rocky-rke2"
description = "Rocky 10 with RKE2 staged for first boot"
version = "0.1.0"

# Comes from the rpm.rancher.io repos in rocky-10.2.json, GPG checked at build time.
[[packages]]
name = "rke2-server"
version = "1.36.4~rke2r1"

[[packages]]
name = "rke2-agent"
version = "1.36.4~rke2r1"

[[packages]]
name = "rke2-selinux"
version = "0.23"

# EL10 ships the iptables modules the CNI needs (xt_conntrack, iptable_nat, ip_set) in this package.
[[packages]]
name = "kernel-modules-extra"

[[packages]]
name = "qemu-guest-agent"

# Holds the VIP on the elected servers. From Rocky 10.2 AppStream.
[[packages]]
name = "keepalived"
version = "2.2.8-9.el10"

# From output/airgap-repo, which airgap.sh builds and build.sh adds with --extra-repo.
[[packages]]
name = "rke2-airgap-images"

# rke2-server, rke2-agent and keepalived stay disabled: rke2-configure writes their config and starts them.
[customizations.services]
enabled = ["qemu-guest-agent"]

# The seeded state unpacks to about 11 GB (4.6 GB content, 6.2 GB snapshots) on top of the OS, which overflows
# the qcow2 type's default size. This stays under tofu's default disk_gib of 40.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "16 GiB"
