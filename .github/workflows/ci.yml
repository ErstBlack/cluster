name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per justfile recipe, so the checks run in parallel.
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [unit, tofu-check, cloud-init-schema, shellcheck, ruff, actionlint]
        include:
          - check: actionlint
            install: |
              bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
              sudo mv actionlint /usr/local/bin/
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - if: matrix.check == 'tofu-check' || matrix.check == 'cloud-init-schema'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      # setup-uv publishes no major-version tags after v7, so it is pinned to a release.
      - if: matrix.check == 'ruff'
        uses: astral-sh/setup-uv@v10.2.0

      - if: matrix.install
        run: ${{ matrix.install }}

      - run: just ${{ matrix.check }}

  test:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
      # Only a save that ran and succeeded counts, so a job that failed before the build never triggers a prune.
      built: ${{ steps.save.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      # hashFiles is not available in job outputs, so a step records the key.
      - id: key
        run: echo "key=rocky-rke2-airgap-${{ hashFiles('image/*') }}" >> "$GITHUB_OUTPUT"

      # The image is restored and, on a miss, built in the job that uses it. A pruned or evicted entry then costs a
      # rebuild, never a failed run. The airgap- prefix keeps pre-airgap entries from being restored.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: image/output/rocky-rke2.qcow2
          key: ${{ steps.key.outputs.key }}

      # airgap.sh fetches into a fixed path under /srv, which the runner user cannot create.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo install -d -o "$USER" /srv/rocky-cluster/images/agent-images
          image/build.sh

      # Saved before the test, so a failed test does not cost the next run a rebuild.
      - id: save
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: image/output/rocky-rke2.qcow2
          key: ${{ steps.key.outputs.key }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - uses: extractions/setup-just@v4

      # tofu test needs an initialised directory.
      - run: just tofu init -backend=false

      - name: Install libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-daemon-system qemu-system-x86 qemu-utils ovmf dnsmasq-base
          # virt-aa-helper leaves the backing image of a type='volume' disk out of the VM's AppArmor profile, so qemu
          # gets "Permission denied" on the base volume (DAC ruled out). The runner is discarded, so run without it.
          echo 'security_driver = "none"' | sudo tee -a /etc/libvirt/qemu.conf
          sudo systemctl restart libvirtd
          sudo setfacl -m "u:$USER:rw" /var/run/libvirt/libvirt-sock
          virsh -c qemu:///system pool-define-as images dir --target /var/lib/libvirt/images
          virsh -c qemu:///system pool-build images
          virsh -c qemu:///system pool-start images

      # main.tf selects Secure Boot firmware with Microsoft keys enrolled. Fail here if ovmf ships no such descriptor.
      - name: Check OVMF enrolled-keys descriptor
        run: grep -l '"enrolled-keys"' /usr/share/qemu/firmware/*.json

      # main.tf puts every ~/.ssh/*.pub into cloud-init. tests/ready logs in with this key.
      - run: |
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519

      - run: just tofu test
        env:
          TF_VAR_base_image_url: ${{ github.workspace }}/image/output/rocky-rke2.qcow2

  # Reports a rebuilt image's cache entry size. On master it deletes the entries the new one supersedes.
  # A separate job, so the job that runs the image build never holds actions: write.
  image-cache:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.built == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEY: ${{ needs.test.outputs.key }}
    steps:
      - run: |
          gh cache list --key "$KEY" --json key,ref,sizeInBytes \
            --jq '"| key | ref | bytes |\n|---|---|---|", (.[] | "| \(.key) | \(.ref) | \(.sizeInBytes) |")' \
            >> "$GITHUB_STEP_SUMMARY"

      - if: github.ref == 'refs/heads/master'
        run: |
          : "${KEY:?an empty key would select every entry}"
          gh cache list --ref refs/heads/master --key rocky-rke2- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | .id" | xargs -r -n1 gh cache delete

  # "Re-run failed jobs" reuses this job's output, whose user cleanup already removed. Only "Re-run all jobs" works.
  tailnet:
    runs-on: ubuntu-24.04
    environment: headscale
    outputs:
      bundle: ${{ steps.setup.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7

      # The bundle is ciphertext only. GitHub drops a job output that contains a masked value.
      - id: setup
        run: |
          bundle=$(ci/headscale.sh setup "ci-${{ github.run_id }}-${{ github.run_attempt }}")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          CI_PASSPHRASE: ${{ secrets.CI_PASSPHRASE }}

  # Two runners join the run's user and must see each other and nothing else. #53 replaces this with the test matrix.
  tailnet-probe:
    needs: tailnet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        slot: [1, 2]
    steps:
      # Installed before the bundle is decrypted, so the third-party script never sees the secrets in the environment.
      - run: curl --fail --silent --show-error --location https://tailscale.com/install.sh | sh

      # The bundle shows in this step's env in a public log, so CI_PASSPHRASE must be random, e.g. openssl rand -base64 32.
      # Sets HEADSCALE_URL, TS_AUTHKEY and RKE2_TOKEN for later steps, each masked before it reaches GITHUB_ENV.
      - name: Decrypt the bundle
        run: |
          bundle=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:CI_PASSPHRASE <<<"$BUNDLE")
          while IFS='=' read -r name value; do
            echo "::add-mask::$value"
            if [[ $name == HEADSCALE_URL ]]; then
              host=${value#*://}
              echo "::add-mask::${host%%[/:]*}"
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done <<<"$bundle"
        env:
          BUNDLE: ${{ needs.tailnet.outputs.bundle }}
          CI_PASSPHRASE: ${{ secrets.CI_PASSPHRASE }}

      # No --advertise-tags: a tagged node falls outside the server's autogroup:self grant.
      - run: >-
          sudo tailscale up --login-server "$HEADSCALE_URL" --auth-key "$TS_AUTHKEY"
          --hostname "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}"

      # Fail at once on any peer from outside this run. Pass after holding for about 30 s once the other probe of this
      # run appears, so that probe sees this one too. Wait up to 10 minutes, since the other slot can queue behind the
      # account's job limit.
      - name: Check peers
        run: |
          # A peer counts as this run's by its Headscale user, which the server assigns, not by its self-chosen hostname.
          # Counts go through command substitution, so a jq or tailscale error stops the step instead of reading as none.
          held=0
          for _ in $(seq 120); do
            status=$(tailscale status --json)
            foreign=$(jq '.Self.UserID as $me | [.Peer // {} | .[] | select(.UserID != $me)] | length' <<<"$status")
            own=$(jq '.Peer // {} | length' <<<"$status")
            if ((foreign)); then
              echo "a peer from outside this run is visible"
              tailscale status
              exit 1
            fi
            if ((held || own == 1)); then
              if ((++held > 6)); then
                exit 0
              fi
            fi
            sleep 5
          done
          tailscale status
          exit 1

      # An ephemeral node that logs out is deleted at once and leaves its peers' lists.
      - if: always()
        run: sudo tailscale logout

  # The user name comes from the run, not from tailnet's output, so a tailnet job that failed midway is cleaned up too.
  cleanup:
    needs: [tailnet, tailnet-probe]
    if: always()
    runs-on: ubuntu-24.04
    environment: headscale
    steps:
      - uses: actions/checkout@v7

      - run: ci/headscale.sh cleanup "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
