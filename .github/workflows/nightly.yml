# Forms a fresh cluster for each case in ci/cases.json (#72). The rows run three at a time from one queue, so nightly
# peaks at the three largest rows, 17 runners of the 20 every workflow shares.
name: nightly

# ci/systemd/cluster-nightly.timer dispatches it daily at 06:00 UTC, since GitHub's schedule started hours late.
on:
  workflow_dispatch:
    inputs:
      case:
        description: Run only this case, e.g. late-joiner. Empty runs every case.
        type: string
      nodes:
        description: Run only this size, 3 to 7. Empty runs every size.
        type: string

permissions:
  contents: read

# A dispatch queues behind a running nightly as a whole.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Builds the image once on a cache miss, so the test slots never build it in parallel.
  image:
    uses: ./.github/workflows/image.yml

  # The rows of ci/cases.json that match the inputs.
  cases:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v7

      - id: cases
        run: |
          cases=$(jq --compact-output --arg case "$CASE" --arg nodes "$NODES" \
            '[.[] | select(($case == "" or .case == $case) and ($nodes == "" or (.nodes | tostring) == $nodes))]' \
            ci/cases.json)
          [ "$cases" != "[]" ] || { echo "::error::no case in ci/cases.json matches"; exit 1; }
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
        env:
          CASE: ${{ inputs.case }}
          NODES: ${{ inputs.nodes }}

  case:
    needs: [image, cases]
    name: ${{ matrix.id }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cases.outputs.cases) }}
    uses: ./.github/workflows/cluster.yml
    secrets: inherit
    with:
      id: ${{ matrix.id }}
      nodes: ${{ matrix.nodes }}
      control_plane_count: ${{ matrix.control_plane_count }}
      case: ${{ matrix.case }}
      test: ${{ matrix.test }}
      expect_nodes: ${{ matrix.expect_nodes }}
      expect_servers: ${{ matrix.expect_servers }}
      image_key: ${{ needs.image.outputs.key }}
